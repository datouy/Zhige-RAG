# ============================================================
# ChineseRAGKB docker-compose - Production deployment
# ============================================================
version: '3.8'

services:
  api:
    build:
      context: .
      # 轻量镜像：不含 torch（~1 GB，而非全量镜像的 ~10 GB）。
      # 需要容器内做本地推理时，改回 dockerfile: Dockerfile。
      dockerfile: Dockerfile.lite
    container_name: chineseragkb-api
    ports:
      - "8000:8000"
    # 让容器能通过 host.docker.internal 访问宿主机上的 Ollama
    # （Linux 下从 Docker 20.10 起用 host-gateway 即可，无需手改 hosts）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Database（口令一律走环境变量，禁止明文写死在 compose 里；
      # 未设置时 compose 会直接报错退出，而不是静默用弱口令启动）
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-raguser}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须设置（见 .env.example）}@postgres:5432/${POSTGRES_DB:-chineseragkb}
      # ---- 模型后端 ----
      # 默认无 LLM：原文摘录 + ONNX 向量，模型已打进 lite 镜像。
      - LLM_BACKEND=${LLM_BACKEND:-extractive}
      - EMBEDDING_BACKEND=${EMBEDDING_BACKEND:-onnx}
      # 改用云端 API 时（可选）：
      #   LLM_BACKEND=openai  EMBEDDING_BACKEND=openai  OPENAI_API_KEY=sk-xxxx
      #   并用 OPENAI_BASE_URL / OPENAI_MODEL 指向你的服务
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.deepseek.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-deepseek-chat}
      # Security
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      # Rate Limiting
      - RATE_LIMIT_STORAGE_URL=redis://redis:6379/0
      # Chroma
      - VECTOR_STORE_PERSIST_DIR=/app/data/chroma
      # Paths
      - DATA_PATH=/app/data/raw
      - LOG_PATH=/app/logs/server.log
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config:ro
      - ./ui/web:/app/ui/web:ro
      # Mount model cache (optional)
      # - ${MODEL_CACHE_DIR:-~/.cache}:/root/.cache:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - chineseragkb-network

  postgres:
    image: postgres:15-alpine
    container_name: chineseragkb-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-raguser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须设置（见 .env.example）}
      - POSTGRES_DB=${POSTGRES_DB:-chineseragkb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 不映射到宿主机端口：数据库只在 compose 内部网络可达，
    # 避免公网/局域网直连（原 "5432:5432" 会暴露给任何能访问该主机的人）。
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raguser} -d ${POSTGRES_DB:-chineseragkb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - chineseragkb-network

  redis:
    image: redis:7-alpine
    container_name: chineseragkb-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    # 同样不暴露到宿主机：Redis 无认证，一旦端口可达即可被任意读写，
    # 进而篡改限流计数 / 污染缓存。
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - chineseragkb-network

networks:
  chineseragkb-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
