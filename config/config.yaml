# =====================================================
# 中文知识库 RAG 系统 - 优化版配置文件
# 
# 优化要点：
# 1. 文本分块：递归字符切分 + 中文标点优先
# 2. 检索：混合检索（向量 + BM25）
# 3. 重排序：Rerank 过滤噪声
# =====================================================

# ------------------ 项目基础 ------------------
project:
  name: "知阁 Zhige"
  version: "0.3.0"
  description: "开箱即用的本地中文知识库 RAG 平台，面向个人开发者与中小企业"

app:
  name: "知阁"
  version: "0.3.0"

# ------------------ 身份 ------------------
# 本服务不提供注册与登录：所有请求自动归属固定的本地用户，
# 数据归属关系见 src/middleware/identity.py，此处无需任何配置。

# ------------------ 数据目录 ------------------
paths:
  raw_docs: "data/raw"
  chroma_db: "data/chroma_db"
  eval: "data/eval"
  logs: "logs"

# ------------------ 文档处理 ------------------
document_loader:
  supported_extensions:
    - .pdf
    - .docx
    - .md
    - .markdown
    - .txt
    - .pptx
    - .xlsx
    - .csv
    - .html
  pdf_engine: "pdfplumber"
  encoding: "auto"
  clean_text: true
  max_pdf_pages: 1000
  markdown_extensions:
    - tables
    - fenced_code

  # 扫描件 OCR（可选能力，实现见 src/document_loader.py::_augment_pdf_with_ocr）
  #
  # 依赖：pip install -r requirements-ocr.txt
  #       （pymupdf + rapidocr-onnxruntime，约 100~150 MB，纯 CPU 可跑，无需 poppler）
  # 未安装时静默跳过，不影响其他功能。
  #
  # 工作方式：先用常规引擎提取文本，再对「文本过少」的页面**逐页** OCR 补齐 ——
  # 因此"正文可正常提取 + 附件页是扫描图"这类混合型 PDF 也能完整入库；
  # OCR 出来的分块 metadata 会打上 ocr=true 便于溯源。
  ocr:
    enabled: true          # 装上依赖后即生效；设为 false 可全局关闭
    min_text_chars: 20     # 单页文本少于该字符数 → 视为需要 OCR
    dpi: 200               # 渲染分辨率：越高越准也越慢（200 通常够用）
    max_pages: 50          # 单文件最多 OCR 多少页（安全阀，防一次上传占满 CPU）

  # 网页导入（实现见 src/web_loader.py，接口 POST /api/v1/ingest/url）
  #
  # 安全：默认拒绝内网地址。校验的是**域名解析后的 IP**，重定向逐跳复检 ——
  # 只校验域名会被 DNS rebinding 绕过（evil.com 解析到 127.0.0.1）。
  url:
    timeout: 15.0
    max_bytes: 5242880     # 单页最大 5 MB
    max_chars: 200000      # 正文最大字符数，超出截断
    # ⚠️ 仅在抓取内网自建服务（内部 Wiki 等）时才打开；
    #    公网可访问的部署务必保持 false，否则等于开放 SSRF。
    allow_private: false

# ------------------ 文本分块（优化版）------------------
# 
# 关键优化：
# - chunk_size: 400（中文经验值 300-500）
# - chunk_overlap: 50（必须有重叠，防止边界语义丢失）
# - separators: 中文标点优先（。！？；，）
#
text_splitter:
  strategy: "chinese"
  chunk_size: 400                 # 中文推荐 300-500，太大语义稀释，太小不完整
  chunk_overlap: 50              # 块间重叠，防止边界语义丢失
  min_chunk_size: 32             # 最小块大小
  chinese_separators:             # 中文标点优先（关键！）
    - "\n\n"                    # 段落分隔
    - "\n"                      # 换行
    - "。"                       # 句号
    - "！"                       # 感叹号
    - "？"                       # 问号
    - "；"                       # 分号
    - "，"                       # 逗号
  keep_separator: true
  strip_whitespace: true

# ------------------ Embedding 模型 ------------------
#
# backend（实现见 src/embeddings_provider.py）：
#   onnx   —— 本地量化 BGE，CPU 推理，约 24 MB，不需要 torch / LLM（当前默认）
#   local  —— sentence-transformers，需要 torch（2~3 GB）
#   ollama —— 本机 Ollama 的 embedding 模型，不需要 torch
#   openai —— 任意 OpenAI 兼容的 /v1/embeddings
#
# ⚠️ 切换 Embedding 模型会改变向量维度。远程后端会自动为 collection
#    追加"后端+模型"指纹，避免与旧向量混在同一个库里（见 embedding_collection_name）。
embedding:
  backend: "onnx"

  # --- backend: onnx（当前机器推荐）---
  # i5-13400 使用 8 线程；GTX 1650 4 GB 留给显示/OCR，不加载生成模型。
  onnx:
    model_path: "./models/bge-small-zh-v1.5-onnx"
    model_file: "onnx/model_quantized.onnx"
    tokenizer_file: "tokenizer.json"
    num_threads: 8
    pooling: "cls"

  # --- backend: ollama（不想装 torch 时首选）---
  # 准备：ollama pull nomic-embed-text
  ollama:
    model: "nomic-embed-text"
    base_url: "http://localhost:11434/v1"
    timeout: 60.0
    # dim: 768            # 不确定可留空，首次 encode 后自动探测并记录

  # --- backend: openai（任何 OpenAI 兼容服务）---
  # 示例：
  #   通义千问  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1   model: text-embedding-v3
  #   硅基流动  base_url: https://api.siliconflow.cn/v1                      model: BAAI/bge-m3
  #   OpenAI   base_url: https://api.openai.com/v1                          model: text-embedding-3-small
  openai:
    model: "text-embedding-3-small"
    base_url: "https://api.openai.com/v1"
    api_key: ${OPENAI_API_KEY:-}
    timeout: 60.0

  # --- 公共参数 / backend: local ---
  model_name: "./models/bge-small-zh-v1.5-onnx"
  device: "cpu"
  batch_size: 32                       # P0-3：批量32，入库吞吐+查询一次编码
  normalize_embeddings: true
  max_seq_length: 512
  # 仅对 bge-*-zh-v1.5 系列等"查询需加指令"的本地模型生效；
  # API embedding 一般不需要，可留空。
  query_instruction: "为这个句子生成表示以用于检索相关文章："
  use_doc_instruction: false
  cache_dir: "./models/sentence-transformers"
  # true = 只用本地已有模型、不联网。**首次部署请改为 false** 让它自动下载（约 100 MB）。
  #
  # ⚠️ 权重已经在本地之后，请把它改回 true：false 会让**每次加载模型**都先去
  #    联网校验（走 HF_ENDPOINT 镜像），网络一慢就是十几秒起步 —— 实测这一项
  #    就让 Embedding 首次加载从 0.2s 变成 26s。界面的「模型设置」写在
  #    config/local_overrides.yaml 里，优先级高于本文件，排查时别忘了看它。
  local_files_only: true

# ------------------ 向量数据库 ------------------
vector_store:
  backend: "chroma"  # chroma | pgvector（pgvector需配pgvector_dsn并安装psycopg+pgvector扩展）
  pgvector_dsn: ""   # 如 postgresql://user:pass@localhost:5432/zhige
  collection_name: "chinese_rag_kb"
  persist_directory: "data/chroma_db"
  distance_fn: "cosine"
  top_k: 4
  fetch_k: 20
  filter_metadata: {}
  
  # 混合检索（优化版）
  hybrid:
    enabled: true                 # 必须开启：向量 + BM25 混合
    fetch_k: 20                  # BM25 召回数（> top_k 保证融合质量）
    # 关键词（BM25）在 RRF 融合里的权重。向量为 1.0。
    # 中文分词是 unigram+bigram 累加、且未按查询长度归一，短查询下长文档
    # 很容易靠"命中词多"拿高分（实测一条无关面试题折算出的"相似度"0.90，
    # 压过真正相关片段的 0.55，并把无关文档顶进引用列表）。
    # 0.5 = 关键词只做召回补充，不压过语义相似度；设为 1.0 恢复旧的等权融合。
    bm25_weight: 0.5

# ------------------ 数据层质量管线 ------------------
data_quality:
  deep_clean: true
  breadcrumb_in_chunk: true       # 分块文本前缀章节路径
  default_acl: "*"
  near_dup_threshold: 0.0
  gate:
    allowed_status: [active]
    require_explicit_acl: false
    expiry_days: 0
    reject_multi_group_acl: true

  # 入库内容质检门禁（d1 决策原语；需 decision.enabled=true）
  #
  # 规则式 DataGate 只能按"状态/权限/过期"过滤，抓不到语义级问题。本门禁用
  #   score 原语 —— 质量分级：乱码/页眉页脚/目录残片/断裂表格 → 低质；
  #   noul  原语 —— 合规判定：涉黄涉暴/违法/极端仇恨 → 可疑。
  # 两个判断在同一次决策调用里完成。实现见 src/ingest_guard.py。
  #
  # action=flag：只给低质/可疑块打 metadata 标记（_guard_low_quality /
  #              _guard_suspicious），内容照常入库 —— 默认，非破坏性；
  # action=drop：低质/可疑块直接拦截不入库（保守部署可选）。
  ingest_guard:
    enabled: false
    action: "flag"
    max_chunks: 200                # 单文件最多检查多少块（成本护栏）
    min_quality_score: 0.3         # 归一化质量分低于此 → 判为低质
    compliance_min_probability: 0.7 # P(违规) ≥ 此值 → 判为可疑

# ------------------ 检索参数（优化版）------------------
#
# 推荐配置：
# - top_k: 8（检索数）
# - rerank_candidates: 24（重排候选数，top_k * 3）
# - min_score: 0.15（向量相似度与 BM25 归一分数量纲不同，默认避免高阈值误拒答）
#
retrieval:
  top_k: 8                       # 召回数
  fetch_k: 24                    # 两阶段召回候选数（向量+BM25先取fetch_k做RRF融合，再截回top_k）
  rerank_candidates: 24            # 重排候选数（top_k * 3）
  score_threshold: 0.0
  min_score: 0.15                 # 混合检索分数量纲不一致，降低硬阈值误拒答
  neighbor_expand: true           # P0-4 small-to-big：命中块前后各补1块，还原文脉
  neighbor_window: 1              # 前后各补几块（1=三连块，2=五连块，上限2防爆炸）
  cache_ttl_seconds: 900          # P1 语义缓存：同问 15min 内直接复用（原15s太短）
  answer_cache_enabled: true      # P1 答案级语义缓存：同问同库24h内直接复用整答，TTFT≈0
  answer_cache_ttl_seconds: 86400 # 答案缓存TTL（秒），入库后自动失效
  hyde_enabled: false             # P1 HyDE：LLM 生成假设答案再检，口语/缩写查询召回+；默认关（需LLM）
  multiquery_enabled: true        # P1 多路召回：原问+去填充词+指代展开取并集RRF，零LLM开销默认开
  max_query_variants: 3           # 多路最多几路（防爆炸）
  llm_query_rewrite: true         # 多轮指代追问用现有 LLM 改写成独立检索问题（仅追问触发）
  llm_query_rewrite_max_tokens: 96
  llm_query_rewrite_timeout_sec: 20
  status_filter: true
  status_filter_fallback: true
  acl_filter: true

# ------------------ 重排序（关键优化）------------------
# 
# Rerank 作用：
# 用 cross-encoder 重排模型（如 bge-reranker）对候选结果重新打分
# 只把真正相关的 Top-3~5 喂给大模型
#
# backend 决定"用什么重排"：
#   bge  —— bge-reranker 交叉编码器（精度高、CPU 上偏慢）
#           优先用 FlagEmbedding；它与当前 transformers 版本不合时自动改用
#           sentence-transformers 的 CrossEncoder（同一份本地权重）
#   d1   —— d1 决策模型 score 原语（毫秒级、0 输出 token，见下方 decision 段）
#   auto —— 优先 d1，不可用时回落 bge
#
# ⚡ 速度优化：如需更快响应，可关闭 reranker (enabled: false)
# 🎯 精度优先：保持开启状态
#
reranker:
  # 开启：把初检的 24 个候选交给交叉编码器重排，能显著改善"答案块排不进 top-k"
  # 的问题。实测（本地 bge-reranker-base）：
  #   提问"本系统使用的是什么大语言模型"，向量 top-4 取不到写着 Qwen2.5-1.5B 的那一块
  #   （它排第 11），重排后回到 top-4；无关提问（天气/菜谱）分数 0.00，会被下面
  #   的 min_relevance 直接挡掉，不再硬编。
  # 代价：多加载一个 ~1.1GB 的重排模型 + 每次约几十毫秒。
  # 想换回纯向量检索（更快）就把 enabled 改回 false。
  # 轻量默认关闭：默认镜像只安装 ONNX Embedding，不含 torch / FlagEmbedding /
  # sentence-transformers，也没有 ~1.1GB 的重排权重。安装 requirements-local.txt
  # 并下载 model_name 后再改为 true，避免“配置显示开启、运行实际停用”的假象。
  enabled: false
  backend: "bge"                   # bge | d1 | auto
  model_name: "./models/bge-reranker-base"
  device: "auto"                   # auto 会优先用显卡；纯 CPU 机器会被自动判为 cpu
  top_n: 3                        # 最终返回数
  max_length: 256
  cache_dir: "./models/huggingface"
  # 重排后最低相关度阈值（交叉编码器 sigmoid 分）。
  # 实测相关提问 ≥0.087（含糊提问）~0.99（表述清楚的提问），无关提问 ≤0.001，
  # 所以 0.05 既能挡掉无关内容，又不会把含糊但相关的候选误杀。
  # 注意：0.3 是当年按 FlagEmbedding 的归一化校准的，换到 CrossEncoder 后偏严。
  min_relevance: 0.05
  max_candidates: 24             # backend=d1 时最多重排多少个候选（成本护栏）

# ------------------ d1 决策层（Decision Primitives）------------------
#
# 参考 Liquid AI d1 决策模型：不做逐 token 生成，而是**单次前向**直接输出决策，
# 毫秒级、0 输出 token、无格式崩塌。定义三种原语：
#   noul   是/否判定（输出 0~1 校准概率）
#   choice 多选一分类（输出各选项概率分布 + 最高置信项）
#   score  有序梯度评分（2~10 级，输出期望分值 + 置信度）
#
# 本配置把决策层接到七个环节（各自独立开关，默认全关 → 行为与改造前一致）：
#   rerank                检索重排     —— score 原语（配合 reranker.backend=d1）
#   query_route           意图路由     —— choice 原语（叠加在正则规则之上）
#   tool_select           Agent 工具调度 —— choice 原语（替代脆弱的 Action 文本解析）
#   verify                答案校验     —— noul（语义接地）+ score（质量分级）
#   retrieval_sufficiency 检索充分性   —— noul 原语（不足则跳过生成直接拒答）
#   feedback_route        差评自动分流 —— choice 原语（对应"工单分流到业务组"）
#   ingest_guard（见 data_quality 段）入库质检/合规 —— score + noul 原语
#
# backend 决定"决策模型从哪来"（实现见 src/decision_provider.py）：
#   llm  —— 用项目已有的 LLM（本地 Qwen / Ollama / OpenAI 兼容）模拟三种原语。
#           **不装 torch、不下载新权重**，与上面的 llm.backend 共用配置。
#   d1   —— 原生加载 LiquidAI/d1-3B（transformers>=5.14 + torch，见
#           requirements-d1.txt）。真正的单次前向，最快最稳。
#   auto —— 先试 d1，权重不可用则自动回落 llm。
#   none —— 关闭决策层。
#
# 【推荐】先按 backend: "llm" 用你现有的本地 Qwen 跑通；有 GPU 再换 "d1"。
decision:
  enabled: false                  # 总开关：false 时以下所有环节均不生效
  backend: "llm"                  # llm | d1 | auto | none
  model_name: "LiquidAI/d1-3B"    # backend=d1 时使用
  device: "auto"
  cache_dir: "./models/huggingface"
  local_files_only: true          # 只用本地已有权重、不联网
  dtype: ""                       # 留空自动（CPU→float32，其它→bfloat16）
  max_new_tokens: 256             # backend=llm 时限制决策输出长度，降低延迟

  rerank:                         # 用 d1 score 重排（需 reranker.enabled=true）
    enabled: false
    relevance_ladder:             # 相关度阶梯（由低到高，2~10 级）
      - "完全不相关"
      - "基本无关"
      - "弱相关"
      - "部分相关"
      - "较为相关"
      - "高度相关"
      - "完全相关"

  query_route:                    # 用 d1 choice 增强意图路由
    enabled: false
    min_confidence: 0.6           # 一般改判所需置信度
    chitchat_min_confidence: 0.75 # 改判为寒暄（会跳过检索）要求更严

  tool_select:                    # 用 d1 choice 预选 Agent 工具
    enabled: false
    min_confidence: 0.5

  verify:                         # 用 d1 noul + score 增强答案校验
    enabled: false

  retrieval_sufficiency:          # 用 d1 noul 判定"检索是否足以回答"
    enabled: false                # 明显不足 → 跳过生成直接拒答（省一次 LLM 调用）
    min_probability: 0.25         # P(充分) 低于此值才判为不足（保守，避免误伤）
    max_chunks: 5                 # 判定时最多喂多少片段

  feedback_route:                 # 用 d1 choice 给差评自动分流到处理环节
    enabled: false                # 自动填充 FeedbackRecord.question_type
    min_confidence: 0.5


# ------------------ 大语言模型 ------------------
#
# backend 决定「回答如何产生」：
#   extractive —— 从命中片段抽取原文并附引用，不加载任何 LLM（当前默认）
#   local      —— 本地 HuggingFace 生成模型（可选，需要 torch）
#   ollama     —— 本机/内网 Ollama（可选）
#   openai     —— 任意 OpenAI 兼容接口（可选）
llm:
  backend: "extractive"

  # --- backend: ollama ---
  # model 用 `ollama list` 显示的名字；Ollama 自带 OpenAI 兼容端点。
  ollama:
    model: "qwen3:4b-instruct-2507-q4_K_M"
    base_url: "http://localhost:11434/v1"
    timeout: 120.0
    # Ollama 默认不校验密钥，留空即可；走内网网关时才需要。
    # api_key: ${OLLAMA_API_KEY:-}

  # --- backend: openai（任何 OpenAI 兼容服务）---
  # 常用示例：
  #   DeepSeek    base_url: https://api.deepseek.com/v1                      model: deepseek-chat
  #   通义千问    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1  model: qwen-plus
  #   智谱清言    base_url: https://open.bigmodel.cn/api/paas/v4              model: glm-4-flash
  #   硅基流动    base_url: https://api.siliconflow.cn/v1                     model: Qwen/Qwen2.5-7B-Instruct
  #   vLLM/LM Studio  base_url: http://localhost:8000/v1
  openai:
    model: "deepseek-chat"
    base_url: "https://api.deepseek.com/v1"
    api_key: ${OPENAI_API_KEY:-}
    timeout: 120.0

  # --- backend: local（本地权重）---
  model_name: "./models/Qwen2.5-1.5B-Instruct"
  model_path: ""
  device: "auto"
  device_map: '{"": 0}'
  torch_dtype: "float16"
  cache_dir: "./models/huggingface"
  trust_remote_code: false
  # true = 只用本地文件、不联网。首次部署请改为 false 让它自动下载，
  # 或提前把权重放到 model_name 指定的目录。这是"开箱即用"最常见的卡点。
  #
  # 权重就位后建议改回 true：false 会在每次加载时联网校验模型元数据，
  # 网络不通/较慢时首问会白等十几秒（同 embedding 段的说明）。
  local_files_only: true
  use_chat_template: true
  chat_template: "auto"

  quantization:
    enabled: true
    quant_type: "nf4"
    compute_dtype: "float16"
    double_quant: true
    cache_dir: "./models/huggingface"

  generation:
    max_new_tokens: 2048         # 长总结避免在句子中途被截断；普通回答通常自然停止
    temperature: 0.1               # 更低温度：0.1 更精准（事实型问答推荐）
    top_p: 0.9
    repetition_penalty: 1.05
    do_sample: true
    stream: true

  timeout: 120.0
  max_retries: 2

# ------------------ RAG 推理参数 ------------------
rag:
  top_k: 8
  use_reranker: false
  # 送进 prompt 的上下文预算（token）。原值 1800 ≈ 3600 个中文字符，
  # 一本普通章节（3000~4000 字）都装不满，而且 _build_context 是"先到先得"
  # 扣预算，后面的分块直接丢弃 —— 模型只能看到开头两段，于是只能给出
  # "以…为背景 / 文中提到"这类目录式回答。按"整章可读"重新设定：
  # 4000 字中文 ≈ 2700 token，12000 给论证、引用和长文档留足余量。
  max_context_tokens: 12000
  max_history_turns: 3
  score_threshold: 0.0
  answer_citations: true
  return_sources: true
  fallback_answer: "抱歉，知识库中未找到相关信息，无法回答该问题。"

  # 全文扩展：总结 / 主旨类问题先由 Top-K 定位文档，再把该文档的全部分块
  # 读入上下文再回答。这条逻辑原先只写在 answer() 里，Web UI 走的
  # stream_answer 完全没有 —— 这是"总结类问题只能给碎片清单"的直接原因。
  fulltext_expand:
    enabled: true
    pattern: "全文|文章|主旨|核心思想|主要表达|总结|概括|整体内容|讲了什么|主要内容|梳理|脉络|想说什么|说明了什么"
    # 单次扩展取几篇文档的全文。"总结这一章"通常只该拿命中分数最高的那一篇；
    # 取多篇会把相邻章节也拖进来，反而稀释预算。要"对比两章"时再调大。
    max_documents: 1
    # 扩展后的字符总上限：防止误触发时把整个知识库倒进 prompt
    max_chars: 40000

  # 超长上下文压缩（map-reduce）。
  # 本地 / 中转推理服务能一次吃下的上下文往往远小于"一整章"：整包塞进去
  # 要么被服务端截断、要么直接返回空响应。旧做法是砍掉后面的分块，于是
  # "总结整章"只能看到开头几段。这里改成先分段提要点（强制保留数字与作者
  # 判断），再把"全文要点地图 + 最相关细节"交给模型综合 —— 既不超窗口，
  # 也不丢主干。
  mapreduce:
    enabled: true
    # 上下文超过这个字符数才触发压缩 —— 只用来兜"整本书 / 多篇合并"这类
    # 一次性塞不进窗口的极端情况。正常的一章（3000~6000 字）不压缩、直接
    # 全量喂给模型，这是回答质量最好的路径。
    #
    # 实测（当前中转服务 deepseek-v4.1-flash）：
    #   · system + 资料合计 3636 字 → 正常回答；
    #   · 单次问答里连续 6~8 次摘要调用会被限流（表现为返回空字符串），
    #     所以真正触发压缩时请保持 inter_call_delay_sec 的间隔。
    # 换成直连大模型（deepseek 官方 / 本地 7B 以上）后可调到 30000 以上。
    soft_limit_chars: 12000
    # 每个摘要段最多吃多少字符
    group_chars: 4000
    # 最多切几段摘要（护栏：避免一次问答打出十几次模型调用）
    max_groups: 6
    # 每段摘要的产出字数上限
    summary_chars: 150
    # 摘要之外再附多少块原始分块作为细节（0 = 只给摘要）
    detail_chunks: 0
    # 分批调用之间的间隔（秒），防限流
    inter_call_delay_sec: 1.5
    # 单段失败后的重试间隔（秒）
    retry_delay_sec: 2.0

  # 无 LLM 模式：只返回最相关的若干原文句子，每条均带 [来源编号]。
  extractive:
    max_chunks: 3
    max_sentences_per_chunk: 2
    max_chars_per_passage: 260
    # 相关性兜底：所有命中块与问题的词面重叠（token/bigram 命中数）都低于
    # 该阈值时，直接返回 rag.fallback_answer 拒答，而不是硬答一篇无关原文。
    # 默认 1 = 至少命中 1 个词面；调 0 恢复旧行为（无 LLM 模式下总返回 top 块）。
    min_term_hits: 1
  system_prompt_file: "config/prompts.yaml"
  assistant_name: "小识"
  org_name: "企业知识库"
  
  # 可验证性校验
  # 这套规则的初衷是防编造，副作用是把"提炼"也判成了编造：判断句的词元
  # 天然不在原文里，min_grounding 会把它算成 unsupported_sentences；
  # min_cited_ratio 要求过半句子带引用，等于逼模型逐句照抄原文。
  # 现在引用率仍照常统计（作为观测指标），但不再据此否定一篇做了综合的回答；
  # synthesis_aware 让"提炼/判断句"豁免词面接地检查（见 src/verifier.py）。
  verification:
    enabled: true
    min_cited_ratio: 0.2
    min_grounding: 0.3
    synthesis_aware: true

# ------------------ 上下文与记忆 ------------------
memory:
  enabled: true
  session_turns: 2
  session_ttl_minutes: 30
  retrieval_rewrite: true
  long_term_inject_limit: 10

# ------------------ 评估 ------------------
evaluation:
  retrieval_top_k: 5
  judge_model: ""
  dataset_path: "data/eval/eval_set.jsonl"
  output_path: "data/eval/results.json"
  report_path: "data/eval/report.json"
  metrics:
    - retrieval_hit_rate
    - answer_keyword_containment
    - avg_latency_sec

# ------------------ Web UI ------------------
ui:
  title: "知阁 · 本地知识库"
  page_icon: "📚"
  theme: "light"
  default_top_k: 4
  default_temperature: 0.2
  show_thinking: false
  max_upload_mb: 50
  max_chat_history: 20
  allowed_upload_types:
    - pdf
    - docx
    - pptx
    - xlsx
    - csv
    - html
    - md
    - txt

# ------------------ 知识图谱 ------------------
knowledge_graph:
  enabled: false                  # 默认关闭
  backend: sqlite
  sqlite_path: data/kg.db
  neo4j:
    uri: bolt://localhost:7687
    user: neo4j
    password: ${NEO4J_PASSWORD:-password}
    database: neo4j
  extractor:
    max_entities_per_chunk: 20
    max_relations_per_chunk: 30
    batch_size: 5
  retriever:
    top_k_entities: 5
    default_hops: 2
    enable_fuzzy_match: true
  graph_rag:
    enabled: false
    graph_hops: 2
