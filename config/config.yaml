# =====================================================
# 中文知识库 RAG 系统 - 优化版配置文件
# 
# 优化要点：
# 1. 文本分块：递归字符切分 + 中文标点优先
# 2. 检索：混合检索（向量 + BM25）
# 3. 重排序：Rerank 过滤噪声
# =====================================================

# ------------------ 项目基础 ------------------
project:
  name: "ChineseRAGKB"
  version: "0.2.0"
  description: "中文知识库 RAG 系统"

app:
  name: "中文知识库 RAG"
  version: "0.2.0"

# ------------------ 数据目录 ------------------
paths:
  raw_docs: "data/raw"
  chroma_db: "data/chroma_db"
  eval: "data/eval"
  logs: "logs"

# ------------------ 文档处理 ------------------
document_loader:
  supported_extensions:
    - .pdf
    - .docx
    - .md
    - .markdown
    - .txt
  pdf_engine: "pdfplumber"
  encoding: "auto"
  clean_text: true
  max_pdf_pages: 1000
  markdown_extensions:
    - tables
    - fenced_code

# ------------------ 文本分块（优化版）------------------
# 
# 关键优化：
# - chunk_size: 400（中文经验值 300-500）
# - chunk_overlap: 50（必须有重叠，防止边界语义丢失）
# - separators: 中文标点优先（。！？；，）
#
text_splitter:
  strategy: "chinese"
  chunk_size: 400                 # 中文推荐 300-500，太大语义稀释，太小不完整
  chunk_overlap: 50              # 块间重叠，防止边界语义丢失
  min_chunk_size: 32             # 最小块大小
  chinese_separators:             # 中文标点优先（关键！）
    - "\n\n"                    # 段落分隔
    - "\n"                      # 换行
    - "。"                       # 句号
    - "！"                       # 感叹号
    - "？"                       # 问号
    - "；"                       # 分号
    - "，"                       # 逗号
  keep_separator: true
  strip_whitespace: true

# ------------------ Embedding 模型 ------------------
embedding:
  model_name: "BAAI/bge-small-zh-v1.5"
  device: "cpu"
  batch_size: 16
  normalize_embeddings: true
  max_seq_length: 512
  query_instruction: "为这个句子生成表示以用于检索相关文章："
  use_doc_instruction: false
  cache_dir: "./models/sentence-transformers"
  local_files_only: true

# ------------------ 向量数据库 ------------------
vector_store:
  backend: "chroma"
  collection_name: "chinese_rag_kb"
  persist_directory: "data/chroma_db"
  distance_fn: "cosine"
  top_k: 4
  fetch_k: 20
  filter_metadata: {}
  
  # 混合检索（优化版）
  hybrid:
    enabled: true                 # 必须开启：向量 + BM25 混合
    fetch_k: 20                  # BM25 召回数（> top_k 保证融合质量）

# ------------------ 数据层质量管线 ------------------
data_quality:
  deep_clean: true
  breadcrumb_in_chunk: true       # 分块文本前缀章节路径
  default_acl: "*"
  near_dup_threshold: 0.0
  gate:
    allowed_status: [active]
    require_explicit_acl: false
    expiry_days: 0
    reject_multi_group_acl: true

# ------------------ 检索参数（优化版）------------------
#
# 推荐配置：
# - top_k: 8（检索数）
# - rerank_candidates: 24（重排候选数，top_k * 3）
# - min_score: 0.25（最低分兜底）
#
retrieval:
  top_k: 8                       # 召回数
  rerank_candidates: 24            # 重排候选数（top_k * 3）
  score_threshold: 0.0
  min_score: 0.25                 # 命中最低分兜底
  status_filter: true
  status_filter_fallback: true
  acl_filter: true

# ------------------ 重排序（关键优化）------------------
# 
# Rerank 作用：
# 用 cross-encoder 重排模型（如 bge-reranker）对候选结果重新打分
# 只把真正相关的 Top-3~5 喂给大模型
#
reranker:
  enabled: true
  model_name: "./models/bge-reranker-base"
  device: "cpu"
  top_n: 3                        # 最终返回数
  max_length: 256
  cache_dir: "./models/huggingface"
  min_relevance: 0.3             # 重排后最低相关度阈值

# ------------------ 大语言模型 ------------------
llm:
  model_name: "./models/Qwen2.5-1.5B-Instruct"
  model_path: ""
  device: "auto"
  device_map: '{"": 0}'
  torch_dtype: "float16"
  cache_dir: "./models/huggingface"
  trust_remote_code: false
  local_files_only: true
  use_chat_template: true
  chat_template: "auto"

  quantization:
    enabled: true
    quant_type: "nf4"
    compute_dtype: "float16"
    double_quant: true
    cache_dir: "./models/huggingface"

  generation:
    max_new_tokens: 256
    temperature: 0.15              # 低温：事实型问答
    top_p: 0.9
    repetition_penalty: 1.05
    do_sample: true
    stream: true

  timeout: 120.0
  max_retries: 2

# ------------------ RAG 推理参数 ------------------
rag:
  top_k: 4
  use_reranker: false
  max_context_tokens: 3000
  max_history_turns: 3
  score_threshold: 0.0
  answer_citations: true
  return_sources: true
  fallback_answer: "抱歉，知识库中未找到相关信息，无法回答该问题。"
  system_prompt_file: "config/prompts.yaml"
  assistant_name: "小识"
  org_name: "企业知识库"
  
  # 可验证性校验
  verification:
    enabled: true
    min_cited_ratio: 0.5
    min_grounding: 0.6

# ------------------ 上下文与记忆 ------------------
memory:
  enabled: true
  session_turns: 2
  session_ttl_minutes: 30
  retrieval_rewrite: true
  long_term_inject_limit: 10

# ------------------ 评估 ------------------
evaluation:
  retrieval_top_k: 5
  judge_model: ""
  dataset_path: "data/eval/eval_set.jsonl"
  output_path: "data/eval/results.json"
  report_path: "data/eval/report.json"
  metrics:
    - retrieval_hit_rate
    - answer_keyword_containment
    - avg_latency_sec

# ------------------ Web UI ------------------
ui:
  title: "中文知识库 RAG"
  page_icon: "📚"
  theme: "light"
  default_top_k: 4
  default_temperature: 0.2
  show_thinking: false
  max_upload_mb: 50
  max_chat_history: 20
  allowed_upload_types:
    - pdf
    - docx
    - md
    - txt

# ------------------ 知识图谱 ------------------
knowledge_graph:
  enabled: false                  # 默认关闭
  backend: sqlite
  sqlite_path: data/kg.db
  neo4j:
    uri: bolt://localhost:7687
    user: neo4j
    password: ${NEO4J_PASSWORD:-password}
    database: neo4j
  extractor:
    max_entities_per_chunk: 20
    max_relations_per_chunk: 30
    batch_size: 5
  retriever:
    top_k_entities: 5
    default_hops: 2
    enable_fuzzy_match: true
  graph_rag:
    enabled: false
    graph_hops: 2
