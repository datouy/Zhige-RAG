apiVersion: v1
kind: Service
metadata:
  name: chineseragkb-api
  namespace: chineseragkb
  labels:
    app: chineseragkb
    component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

  selector:
    app: chineseragkb
    component: api

---
apiVersion: v1
kind: Service
metadata:
  name: chineseragkb-api-nodeport
  namespace: chineseragkb
  labels:
    app: chineseragkb
    component: api
spec:
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: 8000
      nodePort: 30080
      protocol: TCP

  selector:
    app: chineseragkb
    component: api
