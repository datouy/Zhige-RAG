apiVersion: v1
kind: ConfigMap
metadata:
  name: zhige-config
  namespace: zhige
data:
  APP_VERSION: "0.4.0"
  AUTH_MODE: "enterprise"
  AUTH_COOKIE_SECURE: "1"
  AUTH_SESSION_TTL_MINUTES: "480"
  SECRETS_BACKEND: "env"
  VECTOR_STORE_BACKEND: "pgvector"
  KG_BACKEND: "neo4j"
  KG_STRICT_BACKEND: "true"
  LLM_BACKEND: "extractive"
  EMBEDDING_BACKEND: "onnx"
  RATE_LIMIT_QUERY: "60/minute"
  RATE_LIMIT_DEFAULT: "120/minute"
  SLOW_REQUEST_THRESHOLD_MS: "1500"
  OTEL_SERVICE_NAME: "zhige-api"
  ALLOWED_ORIGINS: "https://zhige.example.com"
