apiVersion: v1
kind: Secret
metadata:
  name: zhige-secrets
  namespace: zhige
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_WITH_STRONG_DB_PASSWORD"
  DATABASE_URL: "postgresql+psycopg://zhige:REPLACE_WITH_STRONG_DB_PASSWORD@zhige-postgres:5432/zhige"
  PGVECTOR_DSN: "postgresql://zhige:REPLACE_WITH_STRONG_DB_PASSWORD@zhige-postgres:5432/zhige"
  REDIS_PASSWORD: "REPLACE_WITH_STRONG_REDIS_PASSWORD"
  REDIS_URL: "redis://:REPLACE_WITH_STRONG_REDIS_PASSWORD@zhige-redis:6379/0"
  NEO4J_AUTH: "neo4j/REPLACE_WITH_STRONG_NEO4J_PASSWORD"
  NEO4J_PASSWORD: "REPLACE_WITH_STRONG_NEO4J_PASSWORD"
  BOOTSTRAP_ADMIN_USERNAME: "admin"
  BOOTSTRAP_ADMIN_PASSWORD: "REPLACE_WITH_STRONG_BOOTSTRAP_PASSWORD"
  OPENAI_API_KEY: ""
