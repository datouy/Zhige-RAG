apiVersion: apps/v1
kind: Deployment
metadata:
  name: chineseragkb-api
  namespace: chineseragkb
  labels:
    app: chineseragkb
    component: api
    version: v1
spec:
  # Chroma 与用户级知识图谱使用单写 SQLite/本地文件。增加副本前必须迁移到
  # 集中式向量库与共享图数据库，否则多个 Pod 并发写同一目录会损坏索引。
  replicas: 1
  selector:
    matchLabels:
      app: chineseragkb
      component: api
  # Chroma 与用户级知识图谱当前共享本地单写文件。RollingUpdate 会让新旧
  # Pod 同时打开数据卷；跨节点文件锁与网络文件系统语义无法保证安全。
  # 在迁移到集中式向量库前，用短暂停机换取数据一致性。
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: chineseragkb
        component: api
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/api/metrics"
    spec:
      serviceAccountName: chineseragkb-api

      # Graceful shutdown
      terminationGracePeriodSeconds: 60

      # Init containers
      initContainers:
        - name: wait-for-db
          image: postgres:15-alpine
          command:
            - sh
            - -c
            - |
              until PGPASSWORD=$POSTGRES_PASSWORD psql -h "postgresql" -U "$POSTGRES_USER" -d "postgres" -c '\q'; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chineseragkb-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_USER
              value: "raguser"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

      # Application containers
      containers:
        - name: api
          image: chineseragkb/api:0.3.0
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          env:
            # Secrets
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chineseragkb-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: chineseragkb-secrets
                  key: REDIS_URL
                  optional: true
            - name: ZHIGE_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: chineseragkb-secrets
                  key: ZHIGE_BOOTSTRAP_TOKEN
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: chineseragkb-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: chineseragkb-secrets
                  key: HF_TOKEN
                  optional: true
            - name: ZHIGE_BACKUP_KEY
              valueFrom:
                secretKeyRef:
                  name: chineseragkb-secrets
                  key: ZHIGE_BACKUP_KEY

            # Config from ConfigMap
            - name: APP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: chineseragkb-config
                  key: APP_VERSION
            - name: VECTOR_STORE_PERSIST_DIR
              valueFrom:
                configMapKeyRef:
                  name: chineseragkb-config
                  key: VECTOR_STORE_PERSIST_DIR

          envFrom:
            - configMapRef:
                name: chineseragkb-config

          # Health checks
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 3
            successThreshold: 1

          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            # 首次探测会初始化 persistent client 并检查全部 collection。
            timeoutSeconds: 8
            failureThreshold: 3
            successThreshold: 1

          startupProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30

          # Resources
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi

          # Volume mounts
          volumeMounts:
            - name: data
              mountPath: /data
            - name: cache
              mountPath: /root/.cache
            - name: tmp
              mountPath: /tmp

          # Security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000

        - name: ingest-worker
          image: chineseragkb/api:0.3.0
          imagePullPolicy: Always
          command: ["python", "scripts/ingest_worker.py", "--poll", "2"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chineseragkb-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: chineseragkb-secrets
                  key: REDIS_URL
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: chineseragkb-secrets
                  key: OPENAI_API_KEY
                  optional: true
          envFrom:
            - configMapRef:
                name: chineseragkb-config
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: cache
              mountPath: /root/.cache
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000

      # Volumes
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: chineseragkb-data
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: chineseragkb
                topologyKey: kubernetes.io/hostname

      # Security
      securityContext:
        fsGroup: 1000

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chineseragkb-api
  namespace: chineseragkb
  labels:
    app: chineseragkb
