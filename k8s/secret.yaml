apiVersion: v1
kind: Secret
metadata:
  name: chineseragkb-secrets
  namespace: chineseragkb
  labels:
    app: chineseragkb
    version: v1
type: Opaque
stringData:
  # JWT Configuration
  JWT_SECRET: "CHANGE_ME_IN_PRODUCTION_USE_STRONG_SECRET_KEY"

  # Database credentials
  DATABASE_URL: "postgresql://raguser:CHANGE_PASSWORD@postgresql:5432/ragdb"

  # Redis (optional)
  REDIS_URL: "redis://redis:6379/0"

  # LLM API Keys (if using external providers)
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""

  # Model cache directory (if using shared storage)
  HF_TOKEN: ""

  # Additional secrets
  ADMIN_PASSWORD: "CHANGE_ME"
