apiVersion: v1
kind: Secret
metadata:
  name: chineseragkb-secrets
  namespace: chineseragkb
  labels:
    app: chineseragkb
    version: v1
type: Opaque
stringData:
  # Database credentials
  DATABASE_URL: "postgresql+psycopg://raguser:CHANGE_PASSWORD@postgresql:5432/ragdb"
  POSTGRES_PASSWORD: "CHANGE_PASSWORD"

  # Redis (optional)
  REDIS_URL: "redis://redis:6379/0"

  # LLM API Keys (if using external providers)
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""

  # Model cache directory (if using shared storage)
  HF_TOKEN: ""

