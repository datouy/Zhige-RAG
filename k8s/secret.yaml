apiVersion: v1
kind: Secret
metadata:
  name: chineseragkb-secrets
  namespace: chineseragkb
  labels:
    app: chineseragkb
    version: v1
type: Opaque
stringData:
  # Database credentials
  DATABASE_URL: "postgresql+psycopg://raguser:CHANGE_PASSWORD@postgresql:5432/ragdb"
  POSTGRES_PASSWORD: "CHANGE_PASSWORD"

  # Redis (optional)
  REDIS_URL: "redis://redis:6379/0"

  # Replace before first deploy. Remove/rotate after the initial admin exists.
  ZHIGE_BOOTSTRAP_TOKEN: "CHANGE_TO_RANDOM_ONE_TIME_TOKEN"

  # Generate with: python -c "import base64,secrets; print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())"
  # Keep this key outside the cluster backup. Without it, encrypted backups
  # cannot be restored. Rotate by keeping old keys available for old archives.
  ZHIGE_BACKUP_KEY: "CHANGE_TO_BASE64URL_32_BYTE_KEY"

  # LLM API Keys (if using external providers)
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""

  # Model cache directory (if using shared storage)
  HF_TOKEN: ""

