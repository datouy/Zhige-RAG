apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chineseragkb-api-internal
  namespace: chineseragkb
  labels:
    app: chineseragkb
  annotations:
    # 本项目默认无登录。这里只暴露集群内部域名；如需公网访问，必须先接入
    # 认证代理（OAuth2 Proxy / IAP 等）并完成多用户隔离。
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    nginx.ingress.kubernetes.io/cors-allow-origin: "http://localhost:8000"
    nginx.ingress.kubernetes.io/cors-allow-methods: "PUT, GET, POST, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Content-Type,Accept,Origin,User-Agent,Cache-Control,Keep-Alive,X-Requested-With,X-Request-ID"
spec:
  ingressClassName: nginx
  rules:
    - host: chineseragkb-api.internal
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: chineseragkb-api
                port:
                  name: http
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: chineseragkb-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chineseragkb-api
                port:
                  name: http
