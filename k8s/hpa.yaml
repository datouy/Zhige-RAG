apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chineseragkb-api
  namespace: chineseragkb
  labels:
    app: chineseragkb
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chineseragkb-api

  # Replica bounds
  minReplicas: 1
  maxReplicas: 10

  # Metrics for scaling decisions
  metrics:
    # CPU-based scaling
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    # Memory-based scaling
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

    # Custom metrics (requires metrics-server)
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "100"

  # Behavior configuration
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max

    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Min

---
# PodDisruptionBudget for zero-downtime updates
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: chineseragkb-api
  namespace: chineseragkb
  labels:
    app: chineseragkb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: chineseragkb
      component: api

---
# VerticalPodAutoscaler (optional - enables automatic resource adjustment)
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: chineseragkb-api
  namespace: chineseragkb
  labels:
    app: chineseragkb
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chineseragkb-api
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: api
        minAllowed:
          cpu: 250m
          memory: 512Mi
        maxAllowed:
          cpu: 4000m
          memory: 8Gi
        controlledResources:
          - cpu
          - memory
