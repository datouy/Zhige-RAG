<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能问答</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-inner">
            <h1>📚 智能问答</h1>
            <span id="status" class="status connected">就绪</span>
        </div>
    </header>

    <!-- Chat Container -->
    <main class="chat-container">
        <div id="messages" class="messages">
            <div class="empty-state" id="welcome-state">
                <div class="icon">💬</div>
                <p>向知识库提问</p>
                <p style="font-size: 0.85rem; margin-top: 0.5rem; color: var(--text-muted);">
                    输入问题，按 Enter 发送
                </p>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="chat-input" 
                    placeholder="输入你的问题..."
                    autocomplete="off"
                >
                <button id="send-btn">发送</button>
                <button id="clear-btn" class="btn btn-secondary">清空</button>
            </div>
            <div class="settings-row">
                <span id="chunk-info">知识库: <span id="chunk-count">0</span> 条</span>
            </div>
        </div>
    </main>

    <!-- Chunk Modal -->
    <div id="chunk-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>分块详情</h3>
                <button class="modal-close">&times;</button>
            </div>
            <pre id="modal-text" style="white-space: pre-wrap; word-wrap: break-word;"></pre>
        </div>
    </div>

    <footer class="footer">
        中文知识库 RAG
    </footer>

    <script src="/js/app.js"></script>
</body>
</html>
