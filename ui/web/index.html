<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>知阁</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/shell.css?v=20261120-6">
</head>
<body>
    <a class="skip-link" href="#chat-input">跳到提问</a>
    <div id="alert-container" role="status" aria-live="polite"></div>

    <div class="app-layout" id="app-layout" hidden>
        <button class="sidebar-backdrop" id="sidebar-backdrop" type="button" aria-label="关闭导航"></button>

        <aside class="sidebar" id="sidebar" aria-label="主要导航">
            <div class="sidebar-head">
                <a class="brand" href="/" aria-label="知阁">知阁</a>
                <button class="icon-button sidebar-close" id="sidebar-close" type="button" aria-label="关闭导航">
                    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg>
                </button>
            </div>

            <div class="sidebar-primary">
                <button class="new-chat-button" id="new-session-btn" type="button">
                    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>
                    <span>新对话</span>
                </button>
                <button class="search-button" id="search-btn" type="button" aria-keyshortcuts="Control+K Meta+K">
                    <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="m13 13 4 4"/></svg>
                    <span>搜索</span>
                    <kbd>⌘ K</kbd>
                </button>
            </div>

            <div class="sidebar-scroll">
                <section class="sidebar-section knowledge-section">
                    <div class="section-head">
                        <h2>知识库</h2>
                        <button id="new-kb-btn" class="section-action" type="button" aria-label="新建知识库">
                            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>
                        </button>
                    </div>
                    <ul id="kb-list" class="list"></ul>
                </section>

                <section class="sidebar-section sessions-section">
                    <div class="section-head"><h2>对话</h2></div>
                    <ul id="session-list" class="list"></ul>
                </section>
            </div>

            <div class="sidebar-actions">
                <button id="upload-btn" class="utility-button" type="button">
                    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 13V3m0 0L6.5 6.5M10 3l3.5 3.5M4 12v4h12v-4"/></svg>
                    <span>添加文档</span>
                </button>
                <button id="url-btn" class="utility-button" type="button">
                    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8.2 11.8a3.2 3.2 0 0 0 4.5 0l2-2a3.2 3.2 0 0 0-4.5-4.5l-1 1M11.8 8.2a3.2 3.2 0 0 0-4.5 0l-2 2a3.2 3.2 0 0 0 4.5 4.5l1-1"/></svg>
                    <span>导入网页</span>
                </button>
            </div>

            <div class="sidebar-foot">
                <button id="tasks-btn" class="icon-button" type="button" aria-label="入库任务" title="入库任务">
                    <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M10 6v4l2.6 1.7"/></svg>
                </button>
                <button id="docs-btn" class="icon-button" type="button" aria-label="资料" title="资料">
                    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3h7l3 3v11H5z"/><path d="M12 3v4h4M8 10h4M8 13h4"/></svg>
                </button>
                <span id="status" class="status" aria-live="polite">连接中</span>
                <button id="settings-btn" class="icon-button" type="button" aria-label="模型设置" title="模型设置">
                    <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2.5"/><path d="M8.7 3.6h2.6l.4 2a5.5 5.5 0 0 1 1.1.6l1.9-.9 1.3 2.2-1.5 1.4a5.7 5.7 0 0 1 0 1.3l1.5 1.4-1.3 2.2-1.9-.9a5.5 5.5 0 0 1-1.1.6l-.4 2H8.7l-.4-2a5.5 5.5 0 0 1-1.1-.6l-1.9.9L4 12.6l1.5-1.4a5.7 5.7 0 0 1 0-1.3L4 8.5l1.3-2.2 1.9.9a5.5 5.5 0 0 1 1.1-.6z"/></svg>
                </button>
            </div>
        </aside>

        <main class="main">
            <header class="topbar">
                <button class="icon-button sidebar-open" id="sidebar-open" type="button" aria-label="打开导航">
                    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
                </button>
                <div class="topbar-title">
                    <h1 id="current-kb-name">知识库</h1>
                    <span id="kb-meta"></span>
                </div>
                <div class="topbar-actions">
                    <button id="export-btn" class="icon-button" type="button" aria-label="导出对话" title="导出对话" disabled>
                        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9m0 0 3.5-3.5M10 12 6.5 8.5M4 15h12"/></svg>
                    </button>
                    <div class="mode-control">
                        <button id="mode-btn" class="mode-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="mode-menu">
                            <span id="mode-label">知识库</span>
                            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 8 4 4 4-4"/></svg>
                        </button>
                        <div id="mode-menu" class="mode-menu" role="menu" hidden>
                            <button type="button" role="menuitemradio" aria-checked="true" data-mode="knowledge">知识库</button>
                            <button type="button" role="menuitemradio" aria-checked="false" data-mode="direct">模型</button>
                            <button type="button" role="menuitemradio" aria-checked="false" data-mode="agent">Agents</button>
                        </div>
                    </div>
                </div>
            </header>

            <section id="messages" class="messages" aria-label="对话内容" aria-live="polite">
                <div class="empty-state" id="welcome-state">
                    <h2>开始提问</h2>
                    <div class="empty-actions">
                        <button type="button" data-upload>
                            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 13V3m0 0L6.5 6.5M10 3l3.5 3.5M4 12v4h12v-4"/></svg>
                            添加文档
                        </button>
                        <button type="button" data-import-url>
                            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8.2 11.8a3.2 3.2 0 0 0 4.5 0l2-2a3.2 3.2 0 0 0-4.5-4.5l-1 1M11.8 8.2a3.2 3.2 0 0 0-4.5 0l-2 2a3.2 3.2 0 0 0 4.5 4.5l1-1"/></svg>
                            导入网页
                        </button>
                        <button type="button" data-search>
                            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="m13 13 4 4"/></svg>
                            搜索资料
                        </button>
                    </div>
                </div>
            </section>

            <aside id="citation-panel" class="citation-panel" aria-labelledby="citation-title" hidden>
                <div class="citation-head">
                    <div class="citation-heading">
                        <h2 id="citation-title">引用</h2>
                        <span id="citation-source" class="citation-source"></span>
                    </div>
                    <button id="citation-close" class="icon-button" type="button" aria-label="关闭引用">
                        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg>
                    </button>
                </div>
                <div id="citation-content" class="citation-content"></div>
            </aside>

            <div id="drop-overlay" class="drop-overlay" aria-hidden="true">
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 13V3m0 0L6.5 6.5M10 3l3.5 3.5M4 12v4h12v-4"/></svg>
                <span>松手添加</span>
            </div>

            <footer class="composer-shell">
                <div id="ingest-status" class="ingest-status" role="status" aria-live="polite" hidden>
                    <span id="ingest-status-text"></span>
                    <progress id="ingest-progress" max="100" value="0"></progress>
                </div>
                <form class="composer" id="composer">
                    <button class="composer-action" type="button" data-upload aria-label="添加文档" title="添加文档">
                        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>
                    </button>
                    <textarea id="chat-input" rows="1" placeholder="提问" aria-label="提问"></textarea>
                    <button id="send-btn" class="send-button" type="submit" aria-label="发送">
                        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h11m-4-4 4 4-4 4"/></svg>
                    </button>
                    <button id="stop-btn" class="send-button stop-button" type="button" aria-label="停止" hidden>
                        <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="6" y="6" width="8" height="8" rx="1"/></svg>
                    </button>
                </form>
            </footer>
        </main>
    </div>

    <input type="file" id="file-input" multiple hidden
           accept=".pdf,.docx,.pptx,.xlsx,.csv,.html,.md,.markdown,.txt,.jpg,.jpeg,.png,.bmp,.tif,.tiff,.webp">

    <div id="search-modal" class="modal command-modal" role="dialog" aria-modal="true" aria-labelledby="search-title">
        <div class="modal-content command-content">
            <h2 id="search-title" class="sr-only">搜索资料</h2>
            <div class="command-input-row">
                <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="m13 13 4 4"/></svg>
                <input id="search-input" type="search" placeholder="搜索资料" autocomplete="off" aria-label="搜索资料">
                <button class="modal-close icon-button" type="button" aria-label="关闭搜索">
                    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg>
                </button>
            </div>
            <div id="search-results" class="command-results" aria-live="polite"></div>
        </div>
    </div>

    <div id="import-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="import-title">
        <div class="modal-content compact-modal">
            <div class="modal-header">
                <h2 id="import-title">导入网页</h2>
                <button class="modal-close icon-button" type="button" aria-label="关闭">
                    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg>
                </button>
            </div>
            <form id="import-form" class="stack-form">
                <input id="import-url-input" class="form-control" type="url" inputmode="url" placeholder="https://" aria-label="网页地址" required>
                <button id="import-url-submit" class="btn btn-primary" type="submit">导入</button>
            </form>
        </div>
    </div>

    <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">详情</h2>
                <button class="modal-close icon-button" type="button" aria-label="关闭">
                    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg>
                </button>
            </div>
            <div id="modal-body" class="modal-body"></div>
        </div>
    </div>

    <div id="docs-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="docs-title">
        <div class="modal-content modal-wide docs-modal-content">
            <div class="modal-header">
                <div>
                    <h2 id="docs-title">资料</h2>
                    <span id="docs-kb-name" class="modal-subtitle"></span>
                </div>
                <button class="modal-close icon-button" type="button" aria-label="关闭">
                    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg>
                </button>
            </div>
            <div class="docs-toolbar">
                <input id="docs-filter" class="form-control" type="search" placeholder="筛选" aria-label="筛选资料">
                <select id="docs-source-filter" class="form-control docs-source-filter" aria-label="来源类型">
                    <option value="">全部</option>
                    <option value="file">文件</option>
                    <option value="web">网页</option>
                </select>
                <button id="docs-back" class="btn btn-ghost btn-sm" type="button" hidden>返回</button>
                <button id="docs-refresh" class="icon-button" type="button" aria-label="刷新资料" title="刷新">
                    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10a6 6 0 1 1-1.8-4.2M16 3v4h-4"/></svg>
                </button>
            </div>
            <div id="docs-content" class="docs-content"></div>
        </div>
    </div>

    <div id="tasks-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="tasks-title">
        <div class="modal-content modal-wide tasks-modal-content">
            <div class="modal-header">
                <h2 id="tasks-title">入库任务</h2>
                <button class="modal-close icon-button" type="button" aria-label="关闭">
                    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg>
                </button>
            </div>
            <div id="tasks-content" class="tasks-content" aria-live="polite"></div>
        </div>
    </div>

    <div id="agents-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="agents-title">
        <div class="modal-content modal-wide agents-modal-content">
            <div class="modal-header">
                <h2 id="agents-title">Agents</h2>
                <button class="modal-close icon-button" type="button" aria-label="关闭">
                    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg>
                </button>
            </div>
            <div id="agents-list-view">
                <div class="agents-toolbar">
                    <button id="agent-new" class="btn btn-primary btn-sm" type="button">新建</button>
                    <button id="mcp-open" class="btn btn-ghost btn-sm" type="button">连接</button>
                </div>
                <div id="agents-list" class="agents-list" aria-live="polite"></div>
            </div>
            <form id="agent-form" class="stack-form agent-form" hidden>
                <input id="agent-id" type="hidden">
                <label class="form-label" for="agent-name">名称</label>
                <input id="agent-name" class="form-control" maxlength="80" required>
                <label class="form-label" for="agent-kb">知识库</label>
                <select id="agent-kb" class="form-control" required></select>
                <label class="form-label" for="agent-instructions">工作说明</label>
                <textarea id="agent-instructions" class="form-control" rows="4" maxlength="4000"></textarea>
                <fieldset class="agent-tools-fieldset">
                    <legend>工具</legend>
                    <div id="agent-tools" class="agent-tools"></div>
                </fieldset>
                <div id="agent-form-result" class="settings-result" aria-live="polite"></div>
                <div class="form-actions agent-form-actions">
                    <button id="agent-delete" class="btn btn-ghost agent-delete" type="button" hidden>删除</button>
                    <span class="form-spacer"></span>
                    <button id="agent-cancel" class="btn btn-ghost" type="button">取消</button>
                    <button id="agent-save" class="btn btn-primary" type="submit">保存</button>
                </div>
            </form>
        </div>
    </div>

    <div id="mcp-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="mcp-title">
        <div class="modal-content modal-wide mcp-modal-content">
            <div class="modal-header">
                <h2 id="mcp-title">连接</h2>
                <button class="modal-close icon-button" type="button" aria-label="关闭">
                    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg>
                </button>
            </div>
            <div id="mcp-servers-list" class="mcp-servers-list" aria-live="polite"></div>
            <form id="mcp-form" class="stack-form mcp-form">
                <label class="form-label" for="mcp-name">名称</label>
                <input id="mcp-name" class="form-control" maxlength="80" required>
                <label class="form-label" for="mcp-command">命令</label>
                <input id="mcp-command" class="form-control" maxlength="512" required>
                <label class="form-label" for="mcp-args">参数</label>
                <textarea id="mcp-args" class="form-control" rows="2" placeholder="[&quot;server.py&quot;]"></textarea>
                <div id="mcp-form-result" class="settings-result" aria-live="polite"></div>
                <div class="form-actions">
                    <button class="btn btn-primary" type="submit">添加</button>
                </div>
            </form>
        </div>
    </div>

    <div id="settings-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="modal-content modal-wide">
            <div class="modal-header">
                <h2 id="settings-title">模型</h2>
                <button class="modal-close icon-button" type="button" aria-label="关闭">
                    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg>
                </button>
            </div>
            <div class="modal-body settings-body">
                <section class="settings-section">
                    <h3>回答</h3>
                    <label class="form-label" for="llm-backend">后端</label>
                    <select id="llm-backend" class="form-control">
                        <option value="extractive">原文摘录</option>
                        <option value="local">本机权重</option>
                        <option value="ollama">Ollama</option>
                        <option value="openai">兼容 API</option>
                    </select>
                    <div id="llm-remote" class="remote-fields" hidden>
                        <label class="form-label" for="llm-base-url">地址</label>
                        <input id="llm-base-url" class="form-control" placeholder="http://localhost:11434/v1">
                        <label class="form-label" for="llm-model">模型</label>
                        <input id="llm-model" class="form-control" placeholder="deepseek-chat">
                        <label class="form-label" for="llm-api-key">密钥</label>
                        <input id="llm-api-key" class="form-control" type="password" placeholder="可选">
                    </div>
                    <button id="llm-test" class="btn btn-secondary btn-sm" type="button">测试</button>
                </section>

                <section class="settings-section">
                    <h3>向量</h3>
                    <label class="form-label" for="emb-backend">后端</label>
                    <select id="emb-backend" class="form-control">
                        <option value="onnx">本地 CPU</option>
                        <option value="local">本机权重</option>
                        <option value="ollama">Ollama</option>
                        <option value="openai">兼容 API</option>
                    </select>
                    <div id="emb-remote" class="remote-fields" hidden>
                        <label class="form-label" for="emb-base-url">地址</label>
                        <input id="emb-base-url" class="form-control" placeholder="http://localhost:11434/v1">
                        <label class="form-label" for="emb-model">模型</label>
                        <input id="emb-model" class="form-control" placeholder="bge-m3">
                        <label class="form-label" for="emb-api-key">密钥</label>
                        <input id="emb-api-key" class="form-control" type="password" placeholder="可选">
                    </div>
                    <button id="emb-test" class="btn btn-secondary btn-sm" type="button">测试</button>
                </section>

                <div id="settings-result" class="settings-result" aria-live="polite"></div>
                <div class="form-actions">
                    <button id="settings-reset" class="btn btn-ghost" type="button">恢复默认</button>
                    <button id="settings-save" class="btn btn-primary" type="button">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/app.js?v=20261120-6"></script>
</body>
</html>
