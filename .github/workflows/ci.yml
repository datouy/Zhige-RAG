name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# 整条流水线最长 20 分钟。GitHub 默认 6 小时 —— 一个卡死的测试就能把
# 流水线挂 6 小时，占住并发额度且没人看得住。
# （本仓库此前就出现过 WS 测试挂死的情况，CI 会一直转圈直到超时。）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # 单个 job 的硬超时。测试正常跑完约 40 秒，给 15 分钟足够宽松；
    # 真挂死时 15 分钟后 job 被杀掉，CI 会明确失败而不是无限等待。
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # 只装核心 + 开发依赖。CI 跑的是单元测试，不需要 torch（2~3 GB）；
          # 项目对重依赖是惰性导入，装了只会显著拖慢流水线。
          pip install -r requirements-core.txt
          pip install -r requirements-dev.txt
          # 文档解析的可选依赖：测试里用 importorskip 探测，不装就跳过，
          # 装了才能真正跑到 docx/pdf 的解析分支（此前 CI 上这些测试恒被跳过，
          # 相当于文档解析路径在 CI 里完全没有覆盖）。
          pip install -r requirements-parse-test.txt

      - name: Run linter
        run: |
          ruff check src/ api/ scripts/ tests/ ui/ --output-format=concise

      - name: Check syntax
        run: |
          python -m compileall -q src api scripts tests ui

      - name: Verify database migrations
        run: |
          DB_PATH="$PWD/data/ci_migration.db" alembic upgrade head

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short

      - name: Eval regression gate (retrieval-only, 0.8/0.7/1500ms)
        # P1 评估门禁：差评导出评估集后，CI 用阈值卡死回归。
        #
        # 硬化的部分：此前这条命令后面跟着一个"失败也只告警"的兜底，
        # 无论门禁是否通过，**这一步永远是绿的** —— 门禁形同虚设，
        # 评估指标退化几个月都不会有人知道。
        # 现在改为：evaluate.py 自己以退出码表达成败，CI 直接让它决定成败；
        # 只有"评估集为空"（空库冷启，属预期）才降级为警告。
        #
        # 有数据（自带 runner 挂载 data/chroma_db）的环境可以把
        # --allow-empty-eval 去掉，变成完全硬门禁。
        run: |
          python scripts/evaluate.py \
            --retrieval-only \
            --min-hit-rate 0.8 \
            --min-ndcg 0.7 \
            --max-p95-latency-ms 1500 \
            --allow-empty-eval \
            --no-archive

      - name: Test imports
        run: |
          python -c "from src.factories import TenantAwareFactory; print('Factory module OK')"
          python -c "from src.db.models import User; print('DB models OK')"
