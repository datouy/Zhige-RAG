name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # 只装核心 + 开发依赖。CI 跑的是单元测试，不需要 torch（2~3 GB）；
          # 项目对重依赖是惰性导入，装了只会显著拖慢流水线。
          pip install -r requirements-core.txt
          pip install -r requirements-dev.txt

      - name: Run linter
        run: |
          ruff check src/ api/ --output-format=text

      - name: Check syntax
        run: |
          python -m compileall -q src api scripts tests

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short --ignore=tests/test_agent.py --ignore=tests/test_rag_pipeline.py

      - name: Test imports
        run: |
          python -c "from src.auth.jwt_handler import create_access_token; print('Auth module OK')"
          python -c "from src.factories import TenantAwareFactory; print('Factory module OK')"
          python -c "from src.db.models import User; print('DB models OK')"
