name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # 只装核心 + 开发依赖。CI 跑的是单元测试，不需要 torch（2~3 GB）；
          # 项目对重依赖是惰性导入，装了只会显著拖慢流水线。
          pip install -r requirements-core.txt
          pip install -r requirements-dev.txt

      - name: Run linter
        run: |
          ruff check src/ api/ --output-format=concise

      - name: Check syntax
        run: |
          python -m compileall -q src api scripts tests

      - name: Verify database migrations
        run: |
          DB_PATH="$PWD/data/ci_migration.db" alembic upgrade head

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short

      - name: Eval regression gate (retrieval-only, 0.8/0.7/1500ms)
        # P1 评估门禁：差评导出评估集后，CI 用阈值卡死回归。
        # 空库冷启时检索命中为 0 属预期，故 continue-on-error 只告警不卡死；
        # 有数据（自带 runner 挂载 data/chroma_db）的环境把 continue-on-error
        # 去掉即变硬门禁：--min-hit-rate 0.8 --min-ndcg 0.7 --max-p95 1500。
        continue-on-error: true
        run: |
          pytest tests/test_evaluate_thresholds.py -v --tb=short
          python scripts/evaluate.py --retrieval-only --min-hit-rate 0.8 --min-ndcg 0.7 --max-p95-latency-ms 1500 --no-archive || echo "::warning::eval gate未通过，请查看 data/eval/report.json（差评转 eval 见 POST /api/v1/eval/export-feedback）"

      - name: Test imports
        run: |
          python -c "from src.factories import TenantAwareFactory; print('Factory module OK')"
          python -c "from src.db.models import User; print('DB models OK')"
